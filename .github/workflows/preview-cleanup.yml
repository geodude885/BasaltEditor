name: Take down a preview
# Takes down a pull request's preview (/pr-<number>/). Pull requests don't publish previews for now (see
# ci.yml), so this runs only by hand, for one left behind. To take each down as its pull request closes
# again, put back:
#   on: pull_request: types: [closed]
# and read the number from github.event.pull_request.number.
on:
  workflow_dispatch:
    inputs:
      number:
        description: "The pull request whose preview to take down"
        required: true
        type: number

permissions:
  contents: read

jobs:
  take-down:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-pr-${{ inputs.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github, sparse-checkout-cone-mode: false }
      - run: .github/publish-pages.sh "pr-${{ inputs.number }}"
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
