name: CI
# Checks, tests and builds every push to main and every pull request. On main it then publishes the
# website - the editor as a web app for phones and browsers - to the gh-pages branch (Settings > Pages >
# Source: Deploy from a branch, gh-pages, / (root)).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default: installing and testing run third-party code. Only the publish job, which runs
# none of it, can write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: web, path: out/web, retention-days: 1 }

  publish-web:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publish at a time, and never cut off half-way.
    concurrency:
      group: publish-web
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web, path: web }
      - name: Publish to gh-pages
        working-directory: web
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Web build of ${GITHUB_SHA::7}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            push -f "https://github.com/${REPO}.git" gh-pages
