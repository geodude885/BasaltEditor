name: CI
# Checks, tests and builds every push to main and every pull request, then publishes the website - the
# editor as a web app for phones and browsers - as a test copy on the gh-pages branch (Settings > Pages
# > Source: Deploy from a branch, gh-pages, / (root)):
#   main            -> /prerelease/
#   a pull request  -> /pr-<number>/, taken down when it closes (preview-cleanup.yml)
# The live site, at the root, only changes when a release is published (web-release.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default: installing and testing run third-party code. Only the publish job, which runs
# none of it, can write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The page says which test copy it is (vite.config.web.ts), so it can't be mistaken for the live site.
      - run: npm run build:web
        env:
          BASALT_WEB_CHANNEL: ${{ github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || 'prerelease' }}
          BASALT_WEB_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with: { name: web, path: out/web, retention-days: 1 }

  publish-web:
    needs: check
    # Main, and pull requests from this repository: forks' can't write here, and nor can Dependabot's.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WHERE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prerelease' }}
    # Shows as a deployment, with a link to the copy, on the pull request and the repository's page.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'prerelease' }}
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prerelease' }}/
    # One publish of each copy at a time, never cut off half-way; a newer one waiting replaces an older.
    concurrency:
      group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prerelease' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github, sparse-checkout-cone-mode: false }
      - uses: actions/download-artifact@v4
        with: { name: web, path: web }
      - run: .github/publish-pages.sh "$WHERE" web
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILT_FROM: ${{ github.event.pull_request.head.sha || github.sha }}
