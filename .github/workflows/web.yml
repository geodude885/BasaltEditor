name: Web
# The trial web build, kept apart from ci.yml and release.yml. It checks and tests like CI, builds the
# website, and publishes it to GitHub Pages (Settings > Pages > Source: GitHub Actions; if the deploy
# job is refused, add the `web` branch under Settings > Environments > github-pages).
on:
  push:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with: { path: out/web }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
