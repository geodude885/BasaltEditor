name: Web
# The website: the editor as a web app for phones and browsers. On every push to main it checks,
# tests and builds the web version and publishes it to the gh-pages branch (Settings > Pages > Source:
# Deploy from a branch, gh-pages, / (root)). Pull requests are ci.yml's business; it builds the web
# version too.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Each step's output is kept, and the end of a failing one is reported as an annotation, which
      # can be read through the checks API without the logs.
      - name: Check, test and build
        run: |
          report() {
            echo "::error title=$1 failed::$(tail -n 80 "$1.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          npm run check > check.log 2>&1 || report check
          npm test > test.log 2>&1 || report test
          npm run build:web > build.log 2>&1 || report build
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd out/web
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Web build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
