name: Web
# The trial web build, kept apart from ci.yml and release.yml. It checks and tests like CI, builds the
# website and publishes it to the gh-pages branch (Settings > Pages > Source: Deploy from a branch,
# gh-pages, / (root)). It runs on pushes to `web` and on pull requests from it.
on:
  push:
    branches: [web]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-build
  cancel-in-progress: true

jobs:
  build:
    # Only the web branch; other pull requests are CI's business.
    if: github.ref == 'refs/heads/web' || github.head_ref == 'web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Each step's output is kept, and the end of a failing one is reported as an annotation, which
      # can be read through the checks API without the logs.
      - name: Check, test and build
        run: |
          report() {
            echo "::error title=$1 failed::$(tail -n 80 "$1.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          npm run check > check.log 2>&1 || report check
          npm test > test.log 2>&1 || report test
          npm run build:web > build.log 2>&1 || report build
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd out/web
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Web build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
